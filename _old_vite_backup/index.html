<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlanAI — Crie o seu Business Plan com Inteligência Artificial</title>
  <meta name="description" content="Crie um Business Plan profissional em minutos com inteligência artificial. Responda a algumas perguntas e receba um plano completo para o seu negócio." />
  <!-- Open Graph / Social -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="PlanAI — Business Plan com Inteligência Artificial" />
  <meta property="og:description" content="Responda a 13 perguntas e receba um Business Plan completo de 14 secções, sugestões de nome, briefing de logo e pitch deck. Grátis com OpenRouter." />
  <meta property="og:locale"      content="pt_PT" />
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="PlanAI — Business Plan com IA" />
  <meta name="twitter:description" content="Gere o seu Business Plan profissional em minutos com inteligência artificial." />
  <!-- Theme color -->
  <meta name="theme-color" content="#6366f1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons — MIT licence -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <!-- html2pdf — PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M13 2L3 14h9l-1 16 10-12h-9l1-16z'/></svg>">
</head>
<body>
  <!-- Pearl silk background — SVG turbulence + displacement on iridescent gradients -->
  <svg id="silk-bg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
       style="position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;">
    <defs>
      <filter id="silk-filter" color-interpolation-filters="sRGB"
              x="0%" y="0%" width="100%" height="100%">
        <!-- Directional fractal noise — elongated horizontally like silk folds -->
        <feTurbulence type="fractalNoise"
                      baseFrequency="0.004 0.016"
                      numOctaves="4"
                      seed="9"
                      stitchTiles="stitch"
                      result="noise"/>
        <!-- Displace the gradient mesh to create flowing fold curves -->
        <feDisplacementMap in="SourceGraphic" in2="noise"
                           scale="220"
                           xChannelSelector="R"
                           yChannelSelector="G"/>
      </filter>

      <!-- Metallic pearl sweep — elegant base structure -->
      <linearGradient id="sg1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#f8fafc" stop-opacity="0.80"/>
        <stop offset="18%"  stop-color="#ffffff" stop-opacity="0.95"/>
        <stop offset="36%"  stop-color="#e2e8f0" stop-opacity="0.55"/>
        <stop offset="54%"  stop-color="#ffffff" stop-opacity="0.90"/>
        <stop offset="72%"  stop-color="#f1f5f9" stop-opacity="0.65"/>
        <stop offset="88%"  stop-color="#ffffff" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.70"/>
      </linearGradient>

      <!-- Slate cross sweep — adds subtle depth -->
      <linearGradient id="sg2" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="#cbd5e1" stop-opacity="0.30"/>
        <stop offset="30%"  stop-color="#f8fafc" stop-opacity="0.50"/>
        <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.75"/>
        <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.35"/>
      </linearGradient>

      <!-- Silver & faint indigo shimmer — iridescent peaks and soft valleys -->
      <linearGradient id="sg3" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="#ffffff"  stop-opacity="0.85"/>
        <stop offset="25%"  stop-color="#e0e7ff"  stop-opacity="0.30"/> <!-- faint indigo -->
        <stop offset="50%"  stop-color="#ffffff"  stop-opacity="0.90"/>
        <stop offset="75%"  stop-color="#f8fafc"  stop-opacity="0.40"/>
        <stop offset="100%" stop-color="#f1f5f9"  stop-opacity="0.55"/>
      </linearGradient>
    </defs>

    <!-- Pearl-slate base — no filter -->
    <rect width="100%" height="100%" fill="#fcfcfd"/>

    <!-- Gradient layers — distorted by silk-filter to become flowing folds -->
    <g filter="url(#silk-filter)">
      <rect width="100%" height="100%" fill="url(#sg1)"/>
      <rect width="100%" height="100%" fill="url(#sg2)" opacity="0.60"/>
      <rect width="100%" height="100%" fill="url(#sg3)" opacity="0.50"/>
    </g>
  </svg>

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
